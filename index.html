<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
:root {
  --primary: #0007cd;
  --primary-glow: #1a26ff;
  --accent-cyan: #00d4ff;
  --ink: #ffffff;
  --body: #a8a8a8;
  --muted: #888888;
  --muted-soft: #666666;
  --hairline: #222222;
  --hairline-strong: #333333;
  --canvas: #0f0f0f;
  --surface-card: #181818;
  --surface-elevated: #222222;
  --error: #ff4d4d;
  --radius-md: 8px;
  --radius-xl: 16px;
  --font: "abcDiatype", ui-sans-serif, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--canvas); color: var(--ink); font-family: var(--font); }

.side { width: 240px; flex: none; display: flex; flex-direction: column; gap: 32px; padding: 24px 16px; background: var(--canvas); border-right: 1px solid var(--hairline); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink); }
.brand .mark { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--primary); font-size: 18px; }
.brand small { display: block; font-size: 13px; font-weight: 400; line-height: 1.4; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { padding: 10px 12px; border-radius: var(--radius-md); font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--body); text-decoration: none; }
nav a:hover { background: var(--surface-card); color: var(--ink); }
nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
nav a[aria-current="page"] { background: var(--surface-elevated); color: var(--ink); }

main { position: relative; flex: 1; min-width: 0; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--canvas); }
.pending { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; background: radial-gradient(ellipse 45% 40% at 50% 50%, color-mix(in srgb, var(--primary-glow) 28%, transparent), transparent 100%); }
.pending h1 { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; }
.pending p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--body); }

.home { position: absolute; inset: 0; overflow-y: auto; padding: 32px 24px 48px; color: var(--body); font-size: 16px; line-height: 1.5; }
.home-inner { max-width: 960px; margin: 0 auto; }
.home h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; color: var(--ink); }
.home h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; color: var(--ink); }
.home header p { margin: 0 0 24px; }
.home-status { margin: 0 0 16px; font-size: 14px; color: var(--error); }
.home-status button { height: 36px; margin-left: 8px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--surface-elevated); font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; }

.card { background: var(--surface-card); border-radius: var(--radius-xl); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 0 0 16px; }
.cards .card { padding: 20px 24px; }
.cards dt { font-size: 13px; line-height: 1.4; color: var(--muted); }
.cards dd { margin: 4px 0 0; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; color: var(--ink); overflow-wrap: anywhere; }
.cards dd.alert { color: var(--error); }
.cards .sub { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }

.chart-card { padding: 24px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.chart-head span { font-size: 14px; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; height: 260px; }
.bar-col { min-width: 0; display: flex; flex-direction: column; }
.plot { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-top: 28px; border-bottom: 1px solid var(--hairline-strong); }
.bar { position: relative; width: 100%; max-width: 56px; min-height: 2px; border-radius: 6px 6px 0 0; background: var(--muted-soft); }
.bar-value { position: absolute; bottom: 100%; left: 50%; margin-bottom: 6px; transform: translateX(-50%); font-size: 13px; line-height: 1.2; white-space: nowrap; color: var(--body); }
.bar-label { padding-top: 8px; font-size: 13px; line-height: 1.3; text-align: center; color: var(--muted); }
.bar-label b { display: block; font-weight: 500; color: var(--body); }
.bar-col.today .bar { background: var(--accent-cyan); }
.bar-col.today .bar-value, .bar-col.today .bar-label b { font-weight: 600; color: var(--ink); }

@media (min-width: 1180px) {
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  body { flex-direction: column; }
  .side { width: auto; flex-direction: row; align-items: center; gap: 4px; padding: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hairline); }
  .brand { padding: 0 8px; white-space: nowrap; }
  .brand .mark, .brand small { display: none; }
  nav { flex-direction: row; gap: 0; }
  nav a { padding: 10px; white-space: nowrap; }
  .home { padding: 24px 16px 40px; }
  .cards { gap: 12px; }
  .cards .card { padding: 16px; }
  .cards dd { font-size: 24px; letter-spacing: -0.5px; }
  .chart-card { padding: 20px 16px; }
  .chart { gap: 6px; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="mark" aria-hidden="true">골</span><span>골목카페<small>운영 대시보드</small></span></div>
  <nav id="nav" aria-label="메뉴"></nav>
</aside>
<main>
  <section id="home" class="home" hidden>
    <div class="home-inner">
      <header>
        <h1>홈</h1>
        <p id="home-date"></p>
      </header>
      <p id="home-status" class="home-status" hidden></p>
      <dl class="cards">
        <div class="card"><dt>오늘 매출</dt><dd id="h-sales">–</dd><p class="sub">한국시간 기준</p></div>
        <div class="card"><dt>오늘 주문수</dt><dd id="h-orders">–</dd><p class="sub">판매 입력 건수</p></div>
        <div class="card"><dt>평균 별점</dt><dd id="h-rating">–</dd><p class="sub" id="h-rating-sub"></p></div>
        <div class="card"><dt>재고 부족 메뉴</dt><dd id="h-low">–</dd><p class="sub">재고 5개 이하</p></div>
      </dl>
      <section class="card chart-card" aria-label="최근 7일 매출">
        <div class="chart-head"><h2>최근 7일 매출</h2><span id="week-total"></span></div>
        <div id="chart" class="chart"></div>
      </section>
    </div>
  </section>
  <iframe id="frame" title="화면" hidden></iframe>
  <section id="pending" class="pending" hidden>
    <h1>준비중</h1>
    <p id="pending-text"></p>
  </section>
</main>
<script>
const SUPABASE_URL = 'https://gdtwycpjbnxhqrkbwkmn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2nBy1wRRJ6gVK1iOYLagLw_coWwrGio';
const LOW_STOCK = 5;
const KST = 9 * 60 * 60 * 1000;
const DAY = 24 * 60 * 60 * 1000;
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

const pages = [
  { id: 'home',    label: '홈',   file: null },
  { id: 'sales',   label: '매출', file: 'sales.html' },
  { id: 'menu',    label: '메뉴', file: 'menu.html' },
  { id: 'reviews', label: '리뷰', file: 'reviews.html' },
  { id: 'promo',   label: '홍보', file: 'promo.html' },
];

const nav = document.getElementById('nav');
const home = document.getElementById('home');
const homeStatus = document.getElementById('home-status');
const frame = document.getElementById('frame');
const pending = document.getElementById('pending');
const pendingText = document.getElementById('pending-text');

for (const p of pages) {
  const a = document.createElement('a');
  a.href = '#' + p.id;
  a.textContent = p.label;
  a.dataset.page = p.id;
  nav.append(a);
}

const won = n => n.toLocaleString('ko-KR') + '원';
const compact = new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 });
const short = n => n >= 10000 ? compact.format(n) : n.toLocaleString('ko-KR');

async function api(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: { apikey: SUPABASE_KEY } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || 'HTTP ' + res.status);
  }
  return res.json();
}

function renderChart(start, totals) {
  const max = Math.max(...totals, 1);
  document.getElementById('chart').replaceChildren(...totals.map((value, i) => {
    const day = new Date(start + i * DAY + KST);
    const month = day.getUTCMonth() + 1;
    const date = day.getUTCDate();
    const weekday = WEEKDAYS[day.getUTCDay()];

    const col = document.createElement('div');
    col.className = 'bar-col' + (i === totals.length - 1 ? ' today' : '');
    col.setAttribute('role', 'img');
    col.setAttribute('aria-label', month + '월 ' + date + '일 ' + weekday + '요일 매출 ' + won(value));

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (value / max * 100) + '%';
    const amount = document.createElement('span');
    amount.className = 'bar-value';
    amount.textContent = short(value);
    bar.append(amount);
    const plot = document.createElement('div');
    plot.className = 'plot';
    plot.append(bar);

    const label = document.createElement('div');
    label.className = 'bar-label';
    const top = document.createElement('b');
    top.textContent = i === totals.length - 1 ? '오늘' : month + '/' + date;
    label.append(top, weekday);

    col.append(plot, label);
    return col;
  }));
}

function renderHome(start, sales, reviews, lowMenus) {
  const totals = Array(7).fill(0);
  const counts = Array(7).fill(0);
  for (const s of sales) {
    const i = Math.floor((Date.parse(s.sold_at) - start) / DAY);
    if (i >= 0 && i < 7) {
      totals[i] += s.amount;
      counts[i]++;
    }
  }
  document.getElementById('h-sales').textContent = won(totals[6]);
  document.getElementById('h-orders').textContent = counts[6] + '건';

  const rating = document.getElementById('h-rating');
  const ratingSub = document.getElementById('h-rating-sub');
  if (reviews.length) {
    rating.textContent = (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1);
    ratingSub.textContent = '리뷰 ' + reviews.length + '개';
  } else {
    rating.textContent = '–';
    ratingSub.textContent = '아직 리뷰가 없어요';
  }

  const low = document.getElementById('h-low');
  low.textContent = lowMenus.length + '개';
  low.classList.toggle('alert', lowMenus.length > 0);

  document.getElementById('week-total').textContent = '7일 합계 ' + won(totals.reduce((a, b) => a + b, 0));
  renderChart(start, totals);
}

let homeSeq = 0;
async function loadHome() {
  const mine = ++homeSeq;
  const todayStart = Math.floor((Date.now() + KST) / DAY) * DAY - KST;
  const start = todayStart - 6 * DAY;
  const today = new Date(todayStart + KST);
  document.getElementById('home-date').textContent =
    today.getUTCFullYear() + '년 ' + (today.getUTCMonth() + 1) + '월 ' + today.getUTCDate() + '일 ' +
    WEEKDAYS[today.getUTCDay()] + '요일 · 한국시간 기준';
  try {
    const [sales, reviews, lowMenus] = await Promise.all([
      api('sales?select=amount,sold_at&sold_at=gte.' + encodeURIComponent(new Date(start).toISOString())),
      api('reviews?select=rating'),
      api('menus?select=id&stock=lte.' + LOW_STOCK),
    ]);
    if (mine !== homeSeq) return;
    renderHome(start, sales, reviews, lowMenus);
    homeStatus.hidden = true;
  } catch (err) {
    if (mine !== homeSeq) return;
    homeStatus.textContent = '홈 정보를 불러오지 못했어요. (' + err.message + ')';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = '다시 시도';
    retry.addEventListener('click', loadHome);
    homeStatus.append(retry);
    homeStatus.hidden = false;
  }
}

async function isReady(page) {
  if (!page.file) return false;
  if (location.protocol === 'file:') return true;
  try {
    const res = await fetch(page.file, { method: 'HEAD', cache: 'no-store' });
    return res.ok;
  } catch {
    return false;
  }
}

let seq = 0;
async function show() {
  const page = pages.find(p => '#' + p.id === location.hash) || pages[0];
  const mine = ++seq;

  for (const a of nav.children) {
    if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  document.title = page.label + ' · 골목카페 운영 대시보드';

  home.hidden = page.id !== 'home';
  if (page.id === 'home') {
    frame.hidden = true;
    pending.hidden = true;
    loadHome();
    return;
  }

  const ready = await isReady(page);
  if (mine !== seq) return;

  if (ready) {
    pending.hidden = true;
    frame.hidden = false;
    frame.title = page.label;
    if (frame.getAttribute('src') !== page.file) frame.src = page.file;
  } else {
    frame.hidden = true;
    pendingText.textContent = page.label + ' 화면은 아직 만들고 있어요.';
    pending.hidden = false;
  }
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
