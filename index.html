<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
:root {
  --bg: #f6efe6;
  --surface: #fffaf3;
  --side: #3b2a20;
  --side-text: #e9dccd;
  --accent: #a65d22;
  --text: #2f2118;
  --muted: #6f5d4e;
  --font: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--bg); color: var(--text); font-family: var(--font); }

.side { width: 220px; flex: none; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px; background: var(--side); color: var(--side-text); }
.brand { padding: 0 12px; font-size: 20px; font-weight: 700; color: #fff; }
.brand small { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--side-text); }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { padding: 12px 14px; border-radius: 10px; font-size: 17px; color: inherit; text-decoration: none; }
nav a:hover { background: rgba(255, 255, 255, .08); }
nav a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
nav a[aria-current="page"] { background: var(--accent); color: #fff; font-weight: 700; }

main { position: relative; flex: 1; min-width: 0; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--surface); }
.pending { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
.pending h1 { margin: 0; font-size: 28px; }
.pending p { margin: 0; font-size: 17px; color: var(--muted); }

@media (max-width: 720px) {
  body { flex-direction: column; }
  .side { width: auto; flex-direction: row; align-items: center; gap: 4px; padding: 8px; overflow-x: auto; }
  .brand small { display: none; }
  .brand { padding: 0 8px; font-size: 16px; white-space: nowrap; }
  nav { flex-direction: row; gap: 0; }
  nav a { padding: 10px; font-size: 16px; white-space: nowrap; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">골목카페<small>운영 대시보드</small></div>
  <nav id="nav" aria-label="메뉴"></nav>
</aside>
<main>
  <iframe id="frame" title="화면" hidden></iframe>
  <section id="pending" class="pending" hidden>
    <h1>준비중</h1>
    <p id="pending-text"></p>
  </section>
</main>
<script>
const pages = [
  { id: 'home',    label: '홈',   file: null },
  { id: 'sales',   label: '매출', file: 'sales.html' },
  { id: 'menu',    label: '메뉴', file: 'menu.html' },
  { id: 'reviews', label: '리뷰', file: 'reviews.html' },
  { id: 'promo',   label: '홍보', file: 'promo.html' },
];

const nav = document.getElementById('nav');
const frame = document.getElementById('frame');
const pending = document.getElementById('pending');
const pendingText = document.getElementById('pending-text');

for (const p of pages) {
  const a = document.createElement('a');
  a.href = '#' + p.id;
  a.textContent = p.label;
  a.dataset.page = p.id;
  nav.append(a);
}

async function isReady(page) {
  if (!page.file) return false;
  if (location.protocol === 'file:') return true;
  try {
    const res = await fetch(page.file, { method: 'HEAD', cache: 'no-store' });
    return res.ok;
  } catch {
    return false;
  }
}

let seq = 0;
async function show() {
  const page = pages.find(p => '#' + p.id === location.hash) || pages[0];
  const mine = ++seq;

  for (const a of nav.children) {
    if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  document.title = page.label + ' · 골목카페 운영 대시보드';

  const ready = await isReady(page);
  if (mine !== seq) return;

  if (ready) {
    pending.hidden = true;
    frame.hidden = false;
    frame.title = page.label;
    if (frame.getAttribute('src') !== page.file) frame.src = page.file;
  } else {
    frame.hidden = true;
    pendingText.textContent = page.label + ' 화면은 아직 만들고 있어요.';
    pending.hidden = false;
  }
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
