<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
:root {
  --primary: #0007cd;
  --primary-glow: #1a26ff;
  --ink: #ffffff;
  --body: #a8a8a8;
  --muted: #888888;
  --hairline: #222222;
  --canvas: #0f0f0f;
  --surface-card: #181818;
  --surface-elevated: #222222;
  --radius-md: 8px;
  --font: "abcDiatype", ui-sans-serif, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--canvas); color: var(--ink); font-family: var(--font); }

.side { width: 240px; flex: none; display: flex; flex-direction: column; gap: 32px; padding: 24px 16px; background: var(--canvas); border-right: 1px solid var(--hairline); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink); }
.brand .mark { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--primary); font-size: 18px; }
.brand small { display: block; font-size: 13px; font-weight: 400; line-height: 1.4; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { padding: 10px 12px; border-radius: var(--radius-md); font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--body); text-decoration: none; }
nav a:hover { background: var(--surface-card); color: var(--ink); }
nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
nav a[aria-current="page"] { background: var(--surface-elevated); color: var(--ink); }

main { position: relative; flex: 1; min-width: 0; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--canvas); }
.pending { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; background: radial-gradient(ellipse 45% 40% at 50% 50%, color-mix(in srgb, var(--primary-glow) 28%, transparent), transparent 100%); }
.pending h1 { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; }
.pending p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--body); }

@media (max-width: 720px) {
  body { flex-direction: column; }
  .side { width: auto; flex-direction: row; align-items: center; gap: 4px; padding: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hairline); }
  .brand { padding: 0 8px; white-space: nowrap; }
  .brand .mark, .brand small { display: none; }
  nav { flex-direction: row; gap: 0; }
  nav a { padding: 10px; white-space: nowrap; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="mark" aria-hidden="true">골</span><span>골목카페<small>운영 대시보드</small></span></div>
  <nav id="nav" aria-label="메뉴"></nav>
</aside>
<main>
  <iframe id="frame" title="화면" hidden></iframe>
  <section id="pending" class="pending" hidden>
    <h1>준비중</h1>
    <p id="pending-text"></p>
  </section>
</main>
<script>
const pages = [
  { id: 'home',    label: '홈',   file: null },
  { id: 'sales',   label: '매출', file: 'sales.html' },
  { id: 'menu',    label: '메뉴', file: 'menu.html' },
  { id: 'reviews', label: '리뷰', file: 'reviews.html' },
  { id: 'promo',   label: '홍보', file: 'promo.html' },
];

const nav = document.getElementById('nav');
const frame = document.getElementById('frame');
const pending = document.getElementById('pending');
const pendingText = document.getElementById('pending-text');

for (const p of pages) {
  const a = document.createElement('a');
  a.href = '#' + p.id;
  a.textContent = p.label;
  a.dataset.page = p.id;
  nav.append(a);
}

async function isReady(page) {
  if (!page.file) return false;
  if (location.protocol === 'file:') return true;
  try {
    const res = await fetch(page.file, { method: 'HEAD', cache: 'no-store' });
    return res.ok;
  } catch {
    return false;
  }
}

let seq = 0;
async function show() {
  const page = pages.find(p => '#' + p.id === location.hash) || pages[0];
  const mine = ++seq;

  for (const a of nav.children) {
    if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  document.title = page.label + ' · 골목카페 운영 대시보드';

  const ready = await isReady(page);
  if (mine !== seq) return;

  if (ready) {
    pending.hidden = true;
    frame.hidden = false;
    frame.title = page.label;
    if (frame.getAttribute('src') !== page.file) frame.src = page.file;
  } else {
    frame.hidden = true;
    pendingText.textContent = page.label + ' 화면은 아직 만들고 있어요.';
    pending.hidden = false;
  }
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
