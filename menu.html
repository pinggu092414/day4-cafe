<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴</title>
<style>
:root {
  --primary: #0007cd;
  --primary-active: #0005a3;
  --ink: #ffffff;
  --body: #a8a8a8;
  --muted: #888888;
  --hairline: #222222;
  --hairline-strong: #333333;
  --canvas: #0f0f0f;
  --surface-card: #181818;
  --surface-elevated: #222222;
  --error: #ff4d4d;
  --radius-md: 8px;
  --radius-xl: 16px;
  --font: "abcDiatype", ui-sans-serif, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--body); font-family: var(--font); font-size: 16px; line-height: 1.5; }
.page { max-width: 960px; margin: 0 auto; padding: 32px 24px 48px; }

h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; color: var(--ink); }
h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; line-height: 1.4; color: var(--ink); }
header p { margin: 0 0 24px; }

.card { background: var(--surface-card); border-radius: var(--radius-xl); }
.add { padding: 24px; }

label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.4; color: var(--muted); }
input { width: 100%; height: 44px; padding: 12px 16px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); background: var(--canvas); font: inherit; font-size: 16px; color: var(--ink); }
input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
input::placeholder { color: var(--muted); }

button { height: 44px; padding: 0 18px; border: 0; border-radius: var(--radius-md); font: inherit; font-size: 14px; font-weight: 500; line-height: 1; color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
.primary { background: var(--primary); }
.primary:active:not(:disabled) { background: var(--primary-active); }
.secondary { background: var(--surface-elevated); }

.add-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }

#status { min-height: 24px; margin: 16px 0; font-size: 14px; }
#status.error { color: var(--error); }

.list { overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 140px 170px 72px; gap: 12px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--hairline); }
.row.head { padding-top: 14px; padding-bottom: 14px; border-top: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.row input { height: 40px; padding: 8px 12px; font-size: 15px; }
.name { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.category { overflow-wrap: anywhere; }
.field-label { display: none; }
.stock-wrap { display: flex; align-items: center; gap: 8px; }
.stock-wrap input { min-width: 0; }
input.low { border-color: var(--error); color: var(--error); font-weight: 600; }
.badge { flex: none; padding: 2px 8px; border-radius: 9999px; background: rgb(255 77 77 / .14); font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--error); }
.row button { height: 40px; padding: 0 14px; }

.message { margin: 0; padding: 32px 20px; text-align: center; border-top: 1px solid var(--hairline); }
.message button { margin-left: 8px; }

@media (max-width: 640px) {
  .page { padding: 24px 16px 40px; }
  .add { padding: 20px; }
  .add-grid { grid-template-columns: 1fr 1fr; }
  .add-grid > button { grid-column: 1 / -1; }
  .row { grid-template-columns: 1fr 1fr; padding: 16px; }
  .row.head { display: none; }
  .row .name, .row .category, .row button { grid-column: 1 / -1; }
  .row .category { margin-top: -8px; }
  .field-label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>메뉴</h1>
    <p>메뉴를 추가하고 가격과 재고를 고칠 수 있어요. 재고가 5개 이하면 빨간색으로 보여요.</p>
  </header>

  <form id="add-form" class="card add" autocomplete="off">
    <h2>메뉴 추가</h2>
    <div class="add-grid">
      <label>이름<input name="name" required maxlength="50"></label>
      <label>분류<input name="category" required maxlength="30" list="categories"></label>
      <label>가격(원)<input name="price" type="number" min="0" step="1" inputmode="numeric" required></label>
      <label>재고(개)<input name="stock" type="number" min="0" step="1" inputmode="numeric" required></label>
      <button class="primary" type="submit">추가</button>
    </div>
    <datalist id="categories"></datalist>
  </form>

  <p id="status" role="status"></p>

  <section class="card list" aria-label="메뉴 목록">
    <div class="row head" aria-hidden="true"><span>이름</span><span>분류</span><span>가격(원)</span><span>재고(개)</span><span></span></div>
    <div id="rows"></div>
    <p id="message" class="message">불러오는 중…</p>
  </section>
</main>
<script>
const SUPABASE_URL = 'https://gdtwycpjbnxhqrkbwkmn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2nBy1wRRJ6gVK1iOYLagLw_coWwrGio';
const LOW_STOCK = 5;

const form = document.getElementById('add-form');
const rowsEl = document.getElementById('rows');
const message = document.getElementById('message');
const statusEl = document.getElementById('status');
const categories = document.getElementById('categories');

let menus = [];

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || 'HTTP ' + res.status);
  }
  return res.json();
}

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', isError);
}

function compare(a, b) {
  return a.category.localeCompare(b.category, 'ko') || a.name.localeCompare(b.name, 'ko') || a.id - b.id;
}

function field(labelText, input) {
  const wrap = document.createElement('label');
  const span = document.createElement('span');
  span.className = 'field-label';
  span.textContent = labelText;
  wrap.append(span, input);
  return wrap;
}

function numberInput(value, label) {
  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '1';
  input.required = true;
  input.inputMode = 'numeric';
  input.value = value;
  input.setAttribute('aria-label', label);
  return input;
}

function renderRow(menu) {
  const row = document.createElement('div');
  row.className = 'row';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = menu.name;

  const category = document.createElement('div');
  category.className = 'category';
  category.textContent = menu.category;

  const price = numberInput(menu.price, menu.name + ' 가격');
  const stock = numberInput(menu.stock, menu.name + ' 재고');
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = '부족';
  const stockWrap = document.createElement('div');
  stockWrap.className = 'stock-wrap';
  stockWrap.append(stock, badge);

  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'secondary';
  save.textContent = '저장';

  function sync() {
    const isLow = stock.validity.valid && Number(stock.value) <= LOW_STOCK;
    stock.classList.toggle('low', isLow);
    badge.hidden = !isLow;
    const changed = Number(price.value) !== menu.price || Number(stock.value) !== menu.stock;
    save.disabled = !(price.validity.valid && stock.validity.valid && changed);
  }

  async function saveRow() {
    save.disabled = true;
    try {
      const updated = await api('menus?id=eq.' + menu.id, {
        method: 'PATCH',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify({ price: Number(price.value), stock: Number(stock.value) }),
      });
      if (!updated.length) throw new Error('저장된 행이 없어요');
      Object.assign(menu, updated[0]);
      setStatus('‘' + menu.name + '’ 저장했어요.');
    } catch (err) {
      setStatus('저장하지 못했어요. (' + err.message + ')', true);
    }
    sync();
  }

  for (const input of [price, stock]) {
    input.addEventListener('input', sync);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !save.disabled) saveRow();
    });
  }
  save.addEventListener('click', saveRow);

  row.append(name, category, field('가격(원)', price), field('재고(개)', stockWrap), save);
  sync();
  return row;
}

function updateCategories() {
  const names = [...new Set(menus.map(m => m.category))];
  categories.replaceChildren(...names.map(n => {
    const option = document.createElement('option');
    option.value = n;
    return option;
  }));
}

function showMessage(text, retry) {
  message.textContent = text;
  if (retry) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'secondary';
    button.textContent = '다시 시도';
    button.addEventListener('click', load);
    message.append(button);
  }
  message.hidden = false;
}

async function load() {
  showMessage('불러오는 중…');
  try {
    menus = await api('menus?select=id,name,category,price,stock');
    menus.sort(compare);
    rowsEl.replaceChildren(...menus.map(renderRow));
    updateCategories();
    if (menus.length) message.hidden = true;
    else showMessage('아직 메뉴가 없어요. 위에서 추가해 보세요.');
  } catch (err) {
    showMessage('메뉴를 불러오지 못했어요. (' + err.message + ')', true);
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(form);
  const name = data.get('name').trim();
  const category = data.get('category').trim();
  if (!name || !category) {
    setStatus('이름과 분류를 입력해 주세요.', true);
    return;
  }
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    const [created] = await api('menus', {
      method: 'POST',
      headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ name, category, price: Number(data.get('price')), stock: Number(data.get('stock')) }),
    });
    menus.push(created);
    menus.sort(compare);
    rowsEl.insertBefore(renderRow(created), rowsEl.children[menus.indexOf(created)] || null);
    updateCategories();
    message.hidden = true;
    form.reset();
    form.elements.name.focus();
    setStatus('‘' + created.name + '’ 추가했어요.');
  } catch (err) {
    setStatus('추가하지 못했어요. (' + err.message + ')', true);
  }
  button.disabled = false;
});

load();
</script>
</body>
</html>
