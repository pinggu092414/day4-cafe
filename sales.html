<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출</title>
<style>
:root {
  --primary: #0007cd;
  --primary-active: #0005a3;
  --ink: #ffffff;
  --body: #a8a8a8;
  --muted: #888888;
  --hairline: #222222;
  --hairline-strong: #333333;
  --canvas: #0f0f0f;
  --surface-card: #181818;
  --surface-elevated: #222222;
  --error: #ff4d4d;
  --radius-md: 8px;
  --radius-xl: 16px;
  --font: "abcDiatype", ui-sans-serif, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--body); font-family: var(--font); font-size: 16px; line-height: 1.5; }
.page { max-width: 960px; margin: 0 auto; padding: 32px 24px 48px; }

h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; color: var(--ink); }
h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; line-height: 1.4; color: var(--ink); }
header p { margin: 0 0 24px; }

.card { background: var(--surface-card); border-radius: var(--radius-xl); }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.summary .card { padding: 20px 24px; }
.summary dt { font-size: 13px; line-height: 1.4; color: var(--muted); }
.summary dd { margin: 4px 0 0; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.96px; color: var(--ink); }
.summary dl { margin: 0; }
.add { padding: 24px; }

label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.4; color: var(--muted); }
input, select { width: 100%; height: 44px; padding: 12px 16px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-md); background: var(--canvas); font: inherit; font-size: 16px; color: var(--ink); }
select { padding: 0 12px; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

button { height: 44px; padding: 0 18px; border: 0; border-radius: var(--radius-md); font: inherit; font-size: 14px; font-weight: 500; line-height: 1; color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
.primary { background: var(--primary); }
.primary:active:not(:disabled) { background: var(--primary-active); }
.secondary { background: var(--surface-elevated); }

.add-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
#hint { min-height: 24px; margin: 12px 0 0; font-size: 14px; }
.low { color: var(--error); font-weight: 600; }
.badge { padding: 2px 8px; border-radius: 9999px; background: rgb(255 77 77 / .14); font-size: 12px; line-height: 1.4; }

#status { min-height: 24px; margin: 16px 0; font-size: 14px; }
#status.error { color: var(--error); }

.list { overflow: hidden; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px 110px; gap: 12px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--hairline); }
.row.head { border-top: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.row .num { text-align: right; }
.row .name { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.row .amount { color: var(--ink); }

.message { margin: 0; padding: 32px 20px; text-align: center; border-top: 1px solid var(--hairline); }
.message button { margin-left: 8px; height: 40px; }

@media (max-width: 640px) {
  .page { padding: 24px 16px 40px; }
  .summary { gap: 12px; }
  .summary .card { padding: 16px; }
  .summary dd { font-size: 24px; letter-spacing: -0.5px; }
  .add { padding: 20px; }
  .add-grid { grid-template-columns: 1fr 1fr; }
  .add-grid > :first-child, .add-grid > button { grid-column: 1 / -1; }
  .row { grid-template-columns: 52px minmax(0, 1fr) 44px 88px; gap: 8px; padding: 14px 16px; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>매출</h1>
    <p id="today"></p>
  </header>

  <dl class="summary">
    <div class="card"><dt>오늘 합계</dt><dd id="total">0원</dd></div>
    <div class="card"><dt>판매 건수</dt><dd id="count">0건</dd></div>
  </dl>

  <form id="sell-form" class="card add" autocomplete="off">
    <h2>판매 입력</h2>
    <div class="add-grid">
      <label>메뉴<select name="menu" required></select></label>
      <label>수량<input name="quantity" type="number" min="1" step="1" inputmode="numeric" value="1" required></label>
      <button class="primary" type="submit">판매</button>
    </div>
    <p id="hint"></p>
  </form>

  <p id="status" role="status"></p>

  <section class="card list" aria-label="오늘 판매 목록">
    <div class="row head" aria-hidden="true"><span>시각</span><span>메뉴</span><span class="num">수량</span><span class="num">금액</span></div>
    <div id="rows"></div>
    <p id="message" class="message">불러오는 중…</p>
  </section>
</main>
<script>
const SUPABASE_URL = 'https://gdtwycpjbnxhqrkbwkmn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2nBy1wRRJ6gVK1iOYLagLw_coWwrGio';
const LOW_STOCK = 5;

const form = document.getElementById('sell-form');
const select = form.elements.menu;
const quantity = form.elements.quantity;
const button = form.querySelector('button');
const hint = document.getElementById('hint');
const totalEl = document.getElementById('total');
const countEl = document.getElementById('count');
const rowsEl = document.getElementById('rows');
const message = document.getElementById('message');
const statusEl = document.getElementById('status');

let menus = [];
let sales = [];

const won = n => n.toLocaleString('ko-KR') + '원';

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || 'HTTP ' + res.status);
  }
  return res.json();
}

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', isError);
}

function showMessage(text, retry) {
  message.textContent = text;
  if (retry) {
    const retryButton = document.createElement('button');
    retryButton.type = 'button';
    retryButton.className = 'secondary';
    retryButton.textContent = '다시 시도';
    retryButton.addEventListener('click', refresh);
    message.append(retryButton);
  }
  message.hidden = false;
}

function selectedMenu() {
  return menus.find(m => String(m.id) === select.value);
}

function renderOptions() {
  const previous = select.value;
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = menus.length ? '메뉴를 골라 주세요' : '등록된 메뉴가 없어요';
  const groups = new Map();
  for (const m of menus) {
    if (!groups.has(m.category)) {
      const group = document.createElement('optgroup');
      group.label = m.category;
      groups.set(m.category, group);
    }
    const option = document.createElement('option');
    option.value = m.id;
    option.textContent = m.name + ' · ' + won(m.price) + (m.stock > 0 ? '' : ' · 품절');
    option.disabled = m.stock <= 0;
    groups.get(m.category).append(option);
  }
  select.replaceChildren(placeholder, ...groups.values());
  const keep = menus.find(m => String(m.id) === previous && m.stock > 0);
  select.value = keep ? previous : '';
  button.disabled = !menus.length;
}

function renderHint() {
  hint.replaceChildren();
  const menu = selectedMenu();
  quantity.max = menu ? menu.stock : '';
  if (!menu) return;
  const stock = document.createElement('span');
  stock.textContent = menu.stock + '개';
  hint.append('단가 ' + won(menu.price) + ' · 재고 ', stock);
  if (menu.stock <= LOW_STOCK) {
    stock.className = 'low';
    const badge = document.createElement('span');
    badge.className = 'low badge';
    badge.textContent = '부족';
    hint.append(' ', badge);
  }
  const n = Number(quantity.value);
  if (Number.isInteger(n) && n >= 1) hint.append(' · 합계 ' + won(menu.price * n));
}

function renderSales() {
  const total = sales.reduce((sum, s) => sum + s.amount, 0);
  totalEl.textContent = won(total);
  countEl.textContent = sales.length + '건';
  rowsEl.replaceChildren(...sales.map(s => {
    const row = document.createElement('div');
    row.className = 'row';
    const time = document.createElement('span');
    time.textContent = new Date(s.sold_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.menus ? s.menus.name : '(삭제된 메뉴)';
    const qty = document.createElement('span');
    qty.className = 'num';
    qty.textContent = s.quantity;
    const amount = document.createElement('span');
    amount.className = 'num amount';
    amount.textContent = won(s.amount);
    row.append(time, name, qty, amount);
    return row;
  }));
  if (sales.length) message.hidden = true;
  else showMessage('오늘 판매가 아직 없어요.');
}

async function refresh() {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  try {
    [menus, sales] = await Promise.all([
      api('menus?select=id,name,category,price,stock'),
      api('sales?select=id,quantity,amount,sold_at,menus(name)&sold_at=gte.' + encodeURIComponent(start.toISOString()) + '&order=sold_at.desc,id.desc'),
    ]);
    menus.sort((a, b) => a.category.localeCompare(b.category, 'ko') || a.name.localeCompare(b.name, 'ko') || a.id - b.id);
    renderOptions();
    renderHint();
    renderSales();
  } catch (err) {
    showMessage('매출을 불러오지 못했어요. (' + err.message + ')', true);
  }
}

function sellError(err) {
  if (err.message.includes('insufficient_stock')) return '재고가 부족해요. 남은 재고를 확인해 주세요.';
  if (err.message.includes('menu_not_found')) return '메뉴를 찾을 수 없어요. 목록을 새로 불러왔어요.';
  return '판매를 저장하지 못했어요. (' + err.message + ')';
}

select.addEventListener('change', renderHint);
quantity.addEventListener('input', renderHint);

form.addEventListener('submit', async e => {
  e.preventDefault();
  const menu = selectedMenu();
  const n = Number(quantity.value);
  if (!menu) return;
  button.disabled = true;
  try {
    await api('rpc/sell_menu', {
      method: 'POST',
      body: JSON.stringify({ p_menu_id: menu.id, p_quantity: n }),
    });
    quantity.value = 1;
    setStatus('‘' + menu.name + '’ ' + n + '개 판매했어요.');
  } catch (err) {
    setStatus(sellError(err), true);
  }
  await refresh();
  button.disabled = !menus.length;
});

document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }) + ' 판매';
refresh();
</script>
</body>
</html>
